name: Unit Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/pr-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
  release:
    types: [created]
  workflow_dispatch:

jobs:
  # On a release, skip the test matrix if this workflow already passed for the same commit
  # (for example on the push to main). Otherwise tests run as usual.
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
    - id: check
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        count=$(gh api "repos/${{ github.repository }}/actions/workflows/pr-tests.yml/runs?head_sha=${{ github.sha }}&status=success" --jq '.total_count')
        if [ "${count:-0}" -gt 0 ]; then
          echo "Tests already passed for ${{ github.sha }}, skipping them"
          echo "tested=true" >> "$GITHUB_OUTPUT"
        else
          echo "tested=false" >> "$GITHUB_OUTPUT"
        fi

  test:
    needs: check
    if: needs.check.outputs.tested != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install pytest pytest-cov build pandas pyarrow
        # atspm-detector does not list Python 3.15 yet; its tests skip there
        pip install "${{ matrix.python-version == '3.15' && '.' || '.[detector-health]' }}"

    - name: Build package
      run: python -m build

    - name: Run tests with coverage
      run: pytest --cov=src --cov-report=xml --junitxml=pytest-results.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.15'

    - name: Upload pytest results
      uses: actions/upload-artifact@v7
      with:
        name: pytest-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: pytest-results.xml
      if: ${{ always() }}

  publish:
    needs: [check, test]
    runs-on: ubuntu-latest
    if: >-
      always() && github.event_name == 'release' &&
      (needs.test.result == 'success' ||
       (needs.test.result == 'skipped' && needs.check.outputs.tested == 'true'))

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: twine upload dist/*
